<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroExpert - Práctica de Geografía</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .menu-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-mode { background: var(--primary); color: white; }
        .btn-mode:hover { background: var(--secondary); }
        .btn-mode.active { background: var(--secondary); border: 2px solid var(--primary); }

        #game-area {
            margin-top: 20px;
            min-height: 300px;
        }

        .flag-display {
            font-size: 80px;
            margin: 20px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 15px;
        }

        .option-btn:hover { background: #e9ecef; }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            height: 24px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🇪🇺 EuroExpert</h1>
        <p>Selecciona un modo de juego:</p>
        
        <div class="menu-btns">
            <button class="btn-mode" onclick="setMode('flashcards')">Flashcards</button>
            <button class="btn-mode" onclick="setMode('quiz')">Quiz (Opciones)</button>
            <button class="btn-mode" onclick="setMode('escribir')">Escribir</button>
            <button class="btn-mode" onclick="nextQuestion()">Saltar ⏭️</button>
        </div>

        <div id="game-area">
            <div id="display-container">
                <div class="flag-display" id="flag">🚩</div>
                <h2 id="country-name" class="hidden">País</h2>
            </div>

            <div id="interaction-area">
                </div>
            
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <script>
        // Datos de ejemplo (puedes añadir los 50 países de Europa aquí)
        const countries = [
            { name: "España", flag: "🇪🇸" },
            { name: "Francia", flag: "🇫🇷" },
            { name: "Alemania", flag: "🇩🇪" },
            { name: "Italia", flag: "🇮🇹" },
            { name: "Portugal", flag: "🇵🇹" },
            { name: "Reino Unido", flag: "🇬🇧" },
            { name: "Grecia", flag: "🇬🇷" },
            { name: "Países Bajos", flag: "🇳🇱" },
            { name: "Suecia", flag: "🇸🇪" },
            { name: "Noruega", flag: "🇳🇴" },
            { name: "Polonia", flag: "🇵🇱" },
            { name: "Bélgica", flag: "🇧🇪" }
        ];

        let currentMode = 'flashcards';
        let currentCountry = {};

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            nextQuestion();
        }

        function nextQuestion() {
            currentCountry = countries[Math.floor(Math.random() * countries.length)];
            const flagEl = document.getElementById('flag');
            const nameEl = document.getElementById('country-name');
            const interactEl = document.getElementById('interaction-area');
            const feedback = document.getElementById('feedback');

            flagEl.textContent = currentCountry.flag;
            nameEl.textContent = currentCountry.name;
            feedback.textContent = "";
            interactEl.innerHTML = "";

            if (currentMode === 'flashcards') {
                nameEl.classList.add('hidden');
                interactEl.innerHTML = `<button class="btn-mode" onclick="document.getElementById('country-name').classList.remove('hidden')">Mostrar Nombre</button>`;
            } 
            else if (currentMode === 'quiz') {
                nameEl.classList.add('hidden');
                const options = generateOptions(currentCountry.name);
                const grid = document.createElement('div');
                grid.className = 'options-grid';
                options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => checkAnswer(opt);
                    grid.appendChild(btn);
                });
                interactEl.appendChild(grid);
            } 
            else if (currentMode === 'escribir') {
                nameEl.classList.add('hidden');
                interactEl.innerHTML = `
                    <input type="text" id="write-input" placeholder="¿Qué país es?" autocomplete="off">
                    <br>
                    <button class="btn-mode" onclick="checkWrite()">Comprobar</button>
                `;
                document.getElementById('write-input').focus();
            }
        }

        function generateOptions(correct) {
            let opts = [correct];
            while(opts.length < 4) {
                let randomC = countries[Math.floor(Math.random() * countries.length)].name;
                if(!opts.includes(randomC)) opts.push(randomC);
            }
            return opts.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selected) {
            const feedback = document.getElementById('feedback');
            if(selected === currentCountry.name) {
                feedback.textContent = "✅ ¡Correcto!";
                feedback.style.color = "green";
                setTimeout(nextQuestion, 1000);
            } else {
                feedback.textContent = "❌ Inténtalo de nuevo";
                feedback.style.color = "red";
            }
        }

        function checkWrite() {
            const val = document.getElementById('write-input').value.trim();
            if(val.toLowerCase() === currentCountry.name.toLowerCase()) {
                checkAnswer(currentCountry.name);
            } else {
                checkAnswer("incorrecto");
            }
        }

        // Iniciar juego
        setMode('flashcards');
    </script>
</body>
</html>
